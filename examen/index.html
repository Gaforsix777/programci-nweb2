<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div id="container">
        <h2> Mi Lista de Tareas</h2>
        <input type="text" data-input-tarea placeholder="Escribe una nueva tarea...">
        <button data-button-add> Agregar</button>

        <ul data-task-list>
        </ul>

        <div id="controls">
            <button data-button-tachar> Tachar Último</button>
            <button data-button-contar> Contar Items</button>
        </div>
        <div data-output></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
