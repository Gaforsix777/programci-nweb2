<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de atributos on setAttribute</title>
</head>
<body>
    <div id="elemento">
        Atributo
    </div>
    <script>
        const elemento = document.getElementById("elemento")
        elemento.setAttribute("data-nuevoAt","Valor22")
    </script>
</body>
</html>
